[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools"
]

[dependency-groups]
build = [
  "setuptools"
]
development = [
  "async-asgi-testclient>=1.4.11",
  "bandit[toml]>=1.9.4",
  "basedmypy>=2.10.0",
  "basedpyright>=1.39.0",
  "better-exceptions>=0.3.3",
  "black>=26.3.1",
  "colorama>=0.4.6",
  "grpcio-reflection>=1.71.2",
  "hexora>=0.2.4",
  "mypy>=1.19.1,<1.20.0",
  "pre-commit>=4.5.1",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "pytest-dotenv>=0.5.2",
  "pytest-mock>=3.15.1",
  "pytest-timeout>=2.4.0",
  "pytest>=9.0.2",
  "python-lsp-server[all]>=1.14.0",
  "refurb>=2.3.0",
  "ruff>=0.15.8",
  "structlog>=25.5.0",
  "ty>=0.0.27",
  "typing-extensions>=4.15.0",
  "typing-inspection>=0.4.2",
  "vulture>=2.16",
  "yamlfix>=1.19.1",
  "yamllint>=1.38.0",
]
documentation = [
  "sphinx>=8.1.3",
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinx-rtd-dark-mode>=1.3.0",
  "sphinx-rtd-theme>=3.0.2"
]

[project]
authors = [
  {name = "Alex Kalaverin", email = "alex@kalaver.in"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent"
]
dependencies = [
  "charded",
  "kain",
]
description = "A comprehensive set of advanced utilities for Python programming, e.g. HTTP communication, string handling, logging enhancements, introspection, dynamic importing, property caching descriptors, data class extensions, serialization, etc."
keywords = [
  "dataclass",
  "decorators",
  "descriptors",
  "http",
  "import",
  "introspection",
  "logging",
  "python",
  "serialization",
  "string",
  "utilities"
]
name = "kalib"
readme = "README.md"
requires-python = ">=3.12,<3.14"
version = "0.23.0"

[project.license]
text = "BSD License"

[project.optional-dependencies]
data = [
  "base2048>=0.1.3",
  "fake-useragent>=2.2.0",
  "feedparser>=6.0.11",
  "lxml>=5.4.0",
  "msgpack>=1.1.0",
  "yarl>=1.20.0"
]
redis = [
  "hiredis>=3.2.1",
  "redis-lock-py>=1.1.1",
  "redis>=6.2.0"
]
usual = [
  "natsort>=8.4.0",
  "orjson>=3.10.16",
  "xxhash>=3.5.0",
  "zstd>=1.5.6.7"
]

[tool.bandit]
exclude_dirs = [".venv", ".git"]

[tool.black]
line-length = 89
target-version = ["py311"]

[tool.mypy]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = "all"

[tool.refurb]
ignore = [
  # 149,
  # 176,
  # 191
]

[tool.ruff]
extend = "etc/lint/ruff.toml"

[tool.ruff.lint.isort]
known-third-party = [
  "charded",
  "kain"
]

[tool.ruff.lint.per-file-ignores]
"contrib/*" = []
"docs/*" = [
  "INP001",  # File `docs/conf.py` is part of an implicit namespace package. Add an `__init__.py`.
  "I001",  # [*] Import block is un-sorted or un-formatted
  "PTH100",  # `os.path.abspath()` should be replaced by `Path.resolve()`
  "A001"  # Variable `copyright` is shadowing a Python builtin
]
"src/*" = []
"tests/*" = ["S101", "PLR2004", "ERA001", "INP001"]

[tool.setuptools]
packages = ["kalib"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv]
default-groups = [
  "development"
]

[tool.uv.sources]
charded = { git = "ssh://git@github.com/kalaverin/charded.git", rev = "83f991c3f1f9cbf3b034fe79b657307f359a8822" }
kain = { git = "ssh://git@github.com/kalaverin/kain.git", rev = "b582c3f" }
